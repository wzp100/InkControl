name: Cloud build / 云端构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signing:
        description: 'signed = 发行证书签名 / unsigned = 待签名候选'
        type: choice
        options: [signed, unsigned]
        default: signed

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Regression / 回归
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Repository and translations / 仓库及双语检查
        run: |
          python tools/check_repository.py
          python tools/check_i18n.py
          python tools/check_docs.py
          python tools/export_wiki.py --destination out/native-wiki
      - name: Java and backend regression / Java 及后端回归
        run: python tools/test.py
      - name: Native policy and GPU shaders / 原生策略与 GPU 核
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1-mesa-dev libgles2-mesa-dev
          mkdir -p out/native
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror test/native/algorithm_policy_probe.cpp -o out/native/policy
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -pthread test/native/queue_retry_probe.cpp -o out/native/queue
          g++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror test/native/algorithm_gpu_probe.cpp -lEGL -lGLESv2 -o out/native/gpu
          out/native/policy | tee out/native/policy.txt
          out/native/queue | tee out/native/queue.txt
          out/native/gpu | tee out/native/gpu.txt
      - name: Upload test evidence / 保存测试证据
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/tests-*/results.json
            out/native/*.txt
          retention-days: 7

  android:
    name: APK and Magisk / 安装包
    needs: checks
    # Fork PRs and ordinary PRs never receive private firmware inputs or signing secrets.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap verified Android CLI / 安装已校验 Android 命令行工具
        run: python tools/setup_android.py
      - name: Install pinned Android tools / 固定 Android 工具链
        run: |
          sdkmanager 'platform-tools' 'platforms;android-33' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build and verify / 构建与校验
        id: build
        env:
          INKCONTROL_INPUT_PASSWORD: ${{ secrets.INKCONTROL_INPUT_PASSWORD }}
          INKCONTROL_KEYSTORE_BASE64: ${{ secrets.INKCONTROL_KEYSTORE_BASE64 }}
          INKCONTROL_STORE_PASSWORD: ${{ secrets.INKCONTROL_STORE_PASSWORD }}
          INKCONTROL_KEY_PASSWORD: ${{ secrets.INKCONTROL_KEY_PASSWORD }}
          INKCONTROL_KEY_ALIAS: ${{ secrets.INKCONTROL_KEY_ALIAS }}
        run: python tools/ci_build.py --signing '${{ inputs.signing || 'signed' }}'
      - name: Upload candidate / 保存候选产物
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: InkControl-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.signing || 'signed' }}
          path: |
            ${{ steps.build.outputs.directory }}/InkControl-*.apk
            ${{ steps.build.outputs.directory }}/inkcontrol_backend-*.zip
            ${{ steps.build.outputs.directory }}/SHA256SUMS
            ${{ steps.build.outputs.directory }}/build-manifest.json
            ${{ steps.build.outputs.directory }}/package-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Bilingual UI on cloud emulator / 云端模拟器双语界面
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/inkcontrol-avd
        run: |
          python tools/prepare_cloud_emulator.py
          sdkmanager 'emulator' 'system-images;android-29;default;x86_64'
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" out/ui
          printf 'no\n' | avdmanager create avd --force --name inkcontrol-ci --package 'system-images;android-29;default;x86_64'
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/inkcontrol-ci.avd/config.ini"
          echo 'disk.dataPartition.size=1024M' >> "$ANDROID_AVD_HOME/inkcontrol-ci.avd/config.ini"
          emulator -avd inkcontrol-ci -port 5554 -partition-size 1024 -memory 1536 -cores 2 -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -gpu swiftshader_indirect > out/ui/emulator.log 2>&1 &
          trap 'adb -s emulator-5554 emu kill || true' EXIT
          python tools/test_cloud_language.py --build '${{ steps.build.outputs.directory }}'
      - name: Upload UI evidence / 保存界面证据
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bilingual-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ui/
          retention-days: 7

  release:
    name: Release / 自动发布
    needs: [checks, android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (inputs.signing || 'signed') == 'signed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download this run's evidence / 下载同轮产物及证据
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-${{ github.run_id }}-${{ github.run_attempt }}*'
          path: out/release-input
      - name: Verify and publish immutable version / 校验并发布独立版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py --input out/release-input --publish
